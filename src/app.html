<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <script blocking="render">
            if (
                localStorage.getItem('color-theme') === 'dark' ||
                (!('color-theme' in localStorage) &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
            ) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://api.zigistry.dev" crossorigin />
        <link rel="dns-prefetch" href="https://api.zigistry.dev" />
        <link rel="preconnect" href="https://codeberg.org" crossorigin />
        <link rel="dns-prefetch" href="https://codeberg.org" />
        <link rel="icon" href="/favicon.ico"></link>
        <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin />
        <link rel="dns-prefetch" href="https://avatars.githubusercontent.com" />

        <meta name="robots" content="index, follow" />
        <meta
            name="keywords"
            content="zig package manager, zig, ziglang, zig packages, zig libraries, zig programs, zig registry"
        />
        <meta name="author" content="Rohan Vashisht" />
        <meta name="theme-color" content="#1e1e1e" />

        <meta property="og:site_name" content="Zigistry" />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="https://zigistry.dev/zigister-finds-repos.svg" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:image" content="https://zigistry.dev/zigister-finds-repos.svg" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "Zigistry",
                "url": "https://zigistry.dev/",
                "description": "A registry and index for libraries and programs written for the Zig programming language.",
                "potentialAction": {
                    "@type": "SearchAction",
                    "target": {
                        "@type": "EntryPoint",
                        "urlTemplate": "https://zigistry.dev/search#search={search_term_string}&type=all"
                    },
                    "query-input": "required name=search_term_string"
                }
            }
        </script>

        <meta name="rocket-rocketloader" content="off" />
        %sveltekit.head%
    </head>

    <body
        class="bg-white dark:bg-[rgb(30,30,30)] dark:text-white"
        data-sveltekit-preload-data="hover"
    >
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
